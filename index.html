<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recap Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pyidaungsu', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(to right, #1e293b, #0f172a);
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        header h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }
        header p {
            color: #94a3b8;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        .card {
            background-color: #1e293b;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }
        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 0.75rem;
            color: #38bdf8;
        }
        textarea {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        textarea:focus {
            border-color: #38bdf8;
        }
        .btn {
            background-color: #0ea5e9;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #0284c7;
        }
        .result-box {
            background-color: #0f172a;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-top: 1rem;
            color: #e2e8f0;
        }
        audio {
            width: 100%;
            margin-top: 1rem;
        }
        footer {
            text-align: center;
            padding: 2rem;
            color: #64748b;
            border-top: 1px solid #334155;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎬 Movie Recap Studio</h1>
        <p>AI ဖြင့် ဇာတ်ကား Recap နှင့် အသံဖန်တီးရန်</p>
    </header>

    <div class="container">
        <!-- Text Input Card -->
        <div class="card">
            <h2>🎥 ဇာတ်ကား Recap စာသားထည့်ရန်</h2>
            <textarea id="recapText" rows="4" placeholder="အသံဖန်တီးချင်သော စာသားများကို ဤနေရာတွင် ရိုက်ထည့်ပါ..."></textarea>
            <button class="btn" onclick="generateAudio()">အသံ (Voice) ထုတ်မည်</button>
        </div>

        <!-- Audio Output Card -->
        <div class="card">
            <h2>🔊 ထွက်လာမည့် အသံဖိုင်</h2>
            <div class="result-box" id="statusText">အသံဖိုင် ထွက်လာရန် စောင့်ဆိုင်းနေပါသည်...</div>
            <audio id="audioPlayer" controls style="display: none;"></audio>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Movie Recap Studio. All rights reserved.</p>
    </footer>

    <script>
        async function generateAudio() {
            const text = document.getElementById('recapText').value.trim();
            const statusText = document.getElementById('statusText');
            const audioPlayer = document.getElementById('audioPlayer');

            if (!text) {
                alert('ကျေးဇူးပြု၍ စာသားအနည်းဆုံး တစ်ခုခု ထည့်ပါ။');
                return;
            }

            statusText.innerText = "ElevenLabs AI မှ အသံဖိုင် ဖန်တီးနေပါပြီ၊ ခဏစောင့်ပါ...";
            audioPlayer.style.display = 'none';

            // ⚠️ အောက်ပါနေရာတွင် ကိုယ့်ရဲ့ Render ဆာဗာလင့်ခ်အမှန်ကို ထည့်ပါ (နောက်ဆုံးက /generate-speech ပါရန်)
            const backendUrl = 'https://movie-recap-studio-m9w9.onrender.com/generate-speech';

            try {
                const response = await fetch(backendUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) {
                    throw new Error('အသံဖန်တီးရာတွင် အမှားအယွင်း ရှိသွားပါသည်');
                }

                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);

                audioPlayer.src = audioUrl;
                audioPlayer.style.display = 'block';
                statusText.innerText = "အသံဖိုင် ဖန်တီးပြီးပါပြီ။ နှိပ်၍ နားဆင်နိုင်ပါပြီ။";
                audioPlayer.play();

            } catch (error) {
                statusText.innerText = "အမှားဖြစ်ပွားသည်: " + error.message;
            }
        }
    </script>

</body>
</html>
