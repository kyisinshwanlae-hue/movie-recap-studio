<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recap Studio - AI Powered</title>
    <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pyidaungsu', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(to right, #1e293b, #0f172a);
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        header h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }
        header p {
            color: #94a3b8;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        .card {
            background-color: #1e293b;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #38bdf8;
        }
        input, textarea {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        input:focus, textarea:focus {
            border-color: #38bdf8;
        }
        .btn {
            background-color: #0ea5e9;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #0284c7;
        }
        .result-box {
            background-color: #0f172a;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            white-space: pre-wrap;
            margin-top: 1rem;
            min-height: 100px;
            color: #e2e8f0;
        }
        footer {
            text-align: center;
            padding: 2rem;
            color: #64748b;
            border-top: 1px solid #334155;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎬 Movie Recap Studio</h1>
        <p>Gemini AI ဖြင့် ဇာတ်ကား Recap များ ဖန်တီးရန်</p>
    </header>

    <div class="container">
        <!-- API Key နှင့် Prompt ထည့်ရန် အကွက် -->
        <div class="card">
            <h2>🔑 Gemini API Key ထည့်ရန်</h2>
            <input type="password" id="apiKey" placeholder="আপনার API Key ထည့်ပါ (AIzaSy...)">
           
            <h2>🎥 ဇာတ်ကားနာမည် သို့မဟုတ် အချက်အလက်</h2>
            <textarea id="moviePrompt" rows="3" placeholder="ဥပမာ - Inception ဇာတ်ကားအကြောင်း မြန်မာလို Recap တိုတို ရေးပေးပါ"></textarea>
           
            <button class="btn" onclick="generateRecap()">AI ဖြင့် Recap ထုတ်မည်</button>
        </div>

        <!-- ရလဒ်ထွက်မည့်နေရာ -->
        <div class="card">
            <h2>📜 ထွက်လာမည့် Recap ရလဒ်</h2>
            <div class="result-box" id="outputResult">ရလဒ် ဒီမှာ ပေါ်လာပါမယ်...</div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Movie Recap Studio</p>
    </footer>

    <script>
        async function generateRecap() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('moviePrompt').value.trim();
            const outputBox = document.getElementById('outputResult');

            if (!apiKey) {
                alert('ကျေးဇူးပြု၍ Gemini API Key ထည့်ပါ။');
                return;
            }

            if (!prompt) {
                alert('ဇာတ်ကားအချက်အလက် (သို့) နာမည် ရိုက်ထည့်ပါ။');
                return;
            }

            outputBox.innerText = "AI မှ ဇာတ်ကား Recap ကို ရေးသားနေပါပြီ၊ ခဏစောင့်ပါ...";

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates.length > 0) {
                    const text = data.candidates[0].content.parts[0].text;
                    outputBox.innerText = text;
                } else {
                    outputBox.innerText = "အမှားအယွင်း ရှိပါသည်၊ API Key သို့မဟုတ် Prompt ကို စစ်ဆေးပါ။";
                }
            } catch (error) {
                outputBox.innerText = "ချိတ်ဆက်မှု အမှားအယွင်း ဖြစ်ပွားခဲ့သည်: " + error.message;
            }
        }
    </script>

</body>
</html>
